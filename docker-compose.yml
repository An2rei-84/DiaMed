version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: diamed_db
    environment:
      POSTGRES_DB: diamed
      POSTGRES_USER: diamed
      POSTGRES_PASSWORD: diamed123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U diamed"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: diamed_web
    command: >
      sh -c "
        python manage.py migrate --noinput &&
        python manage.py collectstatic --noinput &&
        gunicorn diamed.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120
      "
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_DB: diamed
      POSTGRES_USER: diamed
      POSTGRES_PASSWORD: diamed123
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432

volumes:
  postgres_data:
  static_volume:
  media_volume:
