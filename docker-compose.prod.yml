# Серверный compose-файл: запускает готовый образ из Docker Hub.
# Скопируйте этот файл на сервер как /var/www/diamed/docker-compose.yml
# и положите рядом .env (шаблон — .env.example, там нужен DIAMED_IMAGE).

services:
  db:
    image: postgres:15-alpine
    container_name: diamed_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-diamed}
      POSTGRES_USER: ${POSTGRES_USER:-diamed}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-diamed123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-diamed}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Порт 5432 наружу не публикуем: база доступна только внутри сети compose

  web:
    image: ${DIAMED_IMAGE:?set DIAMED_IMAGE in .env}
    container_name: diamed_web
    restart: unless-stopped
    command: >
      sh -c "
        python manage.py migrate --noinput &&
        python manage.py collectstatic --noinput &&
        gunicorn diamed.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120
      "
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  static_volume:
  media_volume:
