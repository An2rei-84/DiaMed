[pytest]
testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --screenshot=only-on-failure
    --video=retain-on-failure
    --output=e2e-artifacts
    --alluredir=allure-results
    --clean-alluredir
