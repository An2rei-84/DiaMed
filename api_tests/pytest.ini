[pytest]
testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --alluredir=allure-results
    --clean-alluredir
markers =
    fuzz: property-based фаззинг Schemathesis (запускается через st run, см. README)
