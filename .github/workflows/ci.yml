# CI/CD Pipeline для проекта DiaMed

name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # ==================== Линтинг и проверка кода ====================
  lint:
    name: Линтинг и форматирование
    runs-on: ubuntu-latest
    steps:
      - name: Checkout кода
        uses: actions/checkout@v6

      - name: Установка Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install flake8==7.0.0 flake8-isort==6.1.1 isort==5.13.2 black==23.12.1

      - name: Проверка Flake8
        run: |
          # Остановка при ошибках синтаксиса или неопределенных имен
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Ошибка при ошибках или предупреждениях (можно настроить)
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=88 --statistics

      - name: Проверка isort
        run: |
          isort --check-only --profile black apps diamed e2e api_tests

      - name: Проверка black
        run: |
          black --check apps diamed e2e api_tests

  # ==================== Тестирование ====================
  test:
    name: Запуск тестов
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: diamed
          POSTGRES_PASSWORD: diamed123
          POSTGRES_DB: diamed_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: diamed_test
      POSTGRES_USER: diamed
      POSTGRES_PASSWORD: diamed123
      SECRET_KEY: test-secret-key-for-ci
      DEBUG: True

    steps:
      - name: Checkout кода
        uses: actions/checkout@v6

      - name: Установка Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Применение миграций
        run: |
          python manage.py migrate --noinput

      - name: Запуск тестов с pytest
        run: |
          pytest --cov=apps --cov-report=xml --cov-report=html --verbose

      - name: Загрузка отчета о покрытии в Codecov
        uses: codecov/codecov-action@v7
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

      - name: Загрузка HTML отчета о покрытии
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: htmlcov/

  # ==================== API black-box тесты и фаззинг ====================
  api-tests:
    name: API black-box тесты + Schemathesis
    runs-on: ubuntu-latest
    needs: lint
    env:
      USE_SQLITE: "True"
      DEBUG: "True"
      # Поднятые лимиты: фаззинг шлёт сотни запросов за минуты
      API_ANON_THROTTLE_RATE: "1000/min"
      API_USER_THROTTLE_RATE: "1000/min"
    steps:
      - name: Checkout кода
        uses: actions/checkout@v6

      - name: Установка Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-qa.txt

      - name: API black-box тесты (pytest + requests)
        run: pytest api_tests

      - name: Фаззинг Schemathesis по OpenAPI-схеме
        run: |
          python manage.py migrate --noinput
          python manage.py qa_seed
          python manage.py runserver 127.0.0.1:8039 --noreload &
          sleep 5
          TOKEN=$(curl -s -X POST http://127.0.0.1:8039/api/auth/token/ -H "Content-Type: application/json" -d '{"username":"qa_api","password":"qa_pass_123"}' | python -c "import sys, json; print(json.load(sys.stdin)['access'])")
          st run http://127.0.0.1:8039/api/schema/ --checks not_a_server_error --max-examples 20 --header "Authorization: Bearer $TOKEN"

      - name: Allure-отчёт (генерация)
        if: always()
        run: npx -y allure-commandline generate allure-results -o allure-report-api --clean

      - name: Загрузка Allure-отчёта
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-report-api
          path: allure-report-api/

  # ==================== E2E тесты (Playwright) ====================
  e2e-tests:
    name: E2E тесты (Playwright)
    runs-on: ubuntu-latest
    needs: lint
    env:
      USE_SQLITE: "True"
      DEBUG: "True"
    steps:
      - name: Checkout кода
        uses: actions/checkout@v6

      - name: Установка Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-qa.txt

      - name: Установка Chromium для Playwright
        run: playwright install --with-deps chromium

      - name: E2E тесты
        run: pytest e2e

      - name: Allure-отчёт (генерация)
        if: always()
        run: npx -y allure-commandline generate allure-results -o allure-report-e2e --clean

      - name: Загрузка Allure-отчёта
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-report-e2e
          path: allure-report-e2e/

      - name: Загрузка артефактов падений (скриншоты, видео, лог сервера)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-failure-artifacts
          path: |
            e2e/e2e-artifacts/
            e2e/output/

  # ==================== Сборка Docker образа ====================
  build:
    name: Сборка Docker образа
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout кода
        uses: actions/checkout@v6

      - name: Настройка Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Вход в Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Сборка и публикация образа
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/diamed:latest
            ${{ secrets.DOCKER_USERNAME }}/diamed:${{ github.sha }}
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/diamed:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/diamed:buildcache,mode=max

  # ==================== Деплой (опционально) ====================
  deploy:
    name: Деплой на сервер
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: production
      url: http://144.124.249.130:8001
    steps:
      - name: Checkout кода
        uses: actions/checkout@v6

      - name: Деплой через SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            cd /var/www/diamed
            # Поддержка и нового (docker compose v2), и старого (docker-compose v1)
            if docker compose version >/dev/null 2>&1; then DC="docker compose"; else DC="docker-compose"; fi
            $DC pull
            $DC up -d
            $DC exec -T web python manage.py migrate --noinput
            $DC exec -T web python manage.py collectstatic --noinput
