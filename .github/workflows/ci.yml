# CI/CD Pipeline для проекта DiaMed

name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # ==================== Линтинг и проверка кода ====================
  lint:
    name: Линтинг и форматирование
    runs-on: ubuntu-latest
    steps:
      - name: Checkout кода
        uses: actions/checkout@v6

      - name: Установка Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install flake8 flake8-isort isort black

      - name: Проверка Flake8
        run: |
          # Остановка при ошибках синтаксиса или неопределенных имен
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Ошибка при ошибках или предупреждениях (можно настроить)
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=88 --statistics

      - name: Проверка isort
        run: |
          isort --check-only --profile black apps diamed

      - name: Проверка black
        run: |
          black --check apps diamed

  # ==================== Тестирование ====================
  test:
    name: Запуск тестов
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: diamed
          POSTGRES_PASSWORD: diamed123
          POSTGRES_DB: diamed_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: diamed_test
      POSTGRES_USER: diamed
      POSTGRES_PASSWORD: diamed123
      SECRET_KEY: test-secret-key-for-ci
      DEBUG: True

    steps:
      - name: Checkout кода
        uses: actions/checkout@v6

      - name: Установка Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Применение миграций
        run: |
          python manage.py migrate --noinput

      - name: Запуск тестов с pytest
        run: |
          pytest --cov=apps --cov-report=xml --cov-report=html --verbose

      - name: Загрузка отчета о покрытии в Codecov
        uses: codecov/codecov-action@v7
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

      - name: Загрузка HTML отчета о покрытии
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: htmlcov/

  # ==================== Сборка Docker образа ====================
  build:
    name: Сборка Docker образа
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout кода
        uses: actions/checkout@v6

      - name: Настройка Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Вход в Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Сборка и публикация образа
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/diamed:latest
            ${{ secrets.DOCKER_USERNAME }}/diamed:${{ github.sha }}
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/diamed:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/diamed:buildcache,mode=max

  # ==================== Деплой (опционально) ====================
  deploy:
    name: Деплой на сервер
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: production
      url: http://144.124.249.130:8001
    steps:
      - name: Checkout кода
        uses: actions/checkout@v6

      - name: Деплой через SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            cd /var/www/diamed
            # Поддержка и нового (docker compose v2), и старого (docker-compose v1)
            if docker compose version >/dev/null 2>&1; then DC="docker compose"; else DC="docker-compose"; fi
            $DC pull
            $DC up -d
            $DC exec -T web python manage.py migrate --noinput
            $DC exec -T web python manage.py collectstatic --noinput
